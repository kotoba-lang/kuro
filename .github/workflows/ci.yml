name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # The portable .cljc model. Cannot load kuro.host.*, which is
      # ClojureScript on Node by design.
      - run: clojure -M:test
      - run: clojure -M:lint

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The package.json scripts call `kbb` (ADR-2609112000 kbb cutover). kbb
      # is bin/kbb of kotoba-lang/kotoba, and its ENGINE is kotoba-lang/
      # org-babashka-nbb - the nbb fork whose classpath resolver reads .cljk
      # (stock nbb probes only .cljs/.cljc/.clj and would fail every require
      # after the ADR-2609111500 cljk rename). Both repos are PUBLIC, so the
      # workflow token can check them out. The engine's only runtime dep is
      # import-meta-resolve; lib/ (the precompiled cljs) is tracked in git, so
      # `npm install --omit=dev` is all it needs. The sibling layout
      # (kbb-deps/kotoba next to kbb-deps/org-babashka-nbb) is exactly what
      # bin/kbb's default engine resolution expects:
      # $KBB_HOME/../org-babashka-nbb/cli.js. Measured locally 2026-09-16:
      # this recipe runs test:host 87 tests/290 assertions and test:parity
      # 84 tests/426 assertions, 0 failures (issue #125).
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotoba
          ref: main
          path: kbb-deps/kotoba
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/org-babashka-nbb
          ref: main
          path: kbb-deps/org-babashka-nbb
      - run: npm install --omit=dev --no-audit --no-fund --prefix kbb-deps/org-babashka-nbb
      - run: echo "$GITHUB_WORKSPACE/kbb-deps/kotoba/bin" >> "$GITHUB_PATH"
      - run: npm install
      # The Node host provider. This one actually spawns processes, so it is
      # the gate that proves a receipt describes a command that really ran.
      - run: npm run test:host
      # The SAME .cljc suites under ClojureScript. kuro.ansi was JVM-green and
      # cljs-broken for a day because nothing ran the portable code on the
      # runtime the consumers actually use.
      - run: npm run test:parity
      # The README claims the CID math is parity-locked against an independent
      # Python mint (scripts/cid_mint.py). That claim must RUN, not be told:
      # a mint no job executes is a claim nobody checks. This step proves
      # python3 actually mints the pinned values; test:kuro.host.opfs/python-mint
      # then proves the cljs mint and the Python mint agree on the same vectors.
      - run: |
          test "$(python3 scripts/cid_mint.py hello)" = "bafkreibm6jg3ux5qumhcn2b3flc3tyu6dmlb4xa7u5bf44yegnrjhc4yeq"
          test "$(python3 scripts/cid_mint.py world)" = "bafkreicin2sgejgrxnh3nahtj56jvwlkr4sozcf6opvi4wtmmuta5hfyu4"
      # The nbb harness runs a VENDORED copy of the pinned kotoba.lang.text
      # (e4da1c2) — a vendored copy is a fork the moment someone edits it, and
      # test:parity would stay green while comparing two different libraries.
      # Pin the vendored file's sha256; drift fails this job on purpose.
      # A .cljk script: stock nbb cannot resolve .cljk (ADR-2609111500) -
      # measured on the 2026-09-16 run of this job ("Could not find
      # namespace: kotoba.lang.text"). Run it on the same kbb engine as
      # the suites.
      - run: kbb --backend sci --classpath .:test/cljs-shims scripts/check-text-shim.cljk

  # The browser E2Es (README "Verified end-to-end") ran only on developer
  # machines: shadow-cljs compile + Playwright + wasm-tools were all
  # local-machine steps with no CI job. The guarantees they check — a real
  # OPFS round-trip, a guest fs_read gated by the grant, a real WASM guest
  # streaming into kuro.stream — degrade silently without a gate, which is
  # exactly the failure mode test:parity exists to prevent for the
  # portable model. Same rule: a claim nobody runs is not a claim.
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install wasm-tools
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.243.0/wasm-tools-1.243.0-x86_64-linux.tar.gz -o /tmp/wasm-tools.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-1.243.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Compile the browser build
        run: npx shadow-cljs compile fs-browser
      - name: OPFS round-trip E2E
        run: npx nbb -cp test/browser test/browser/verify_opfs_browser.cljk
      - name: Guest fs capability E2E
        run: npx nbb -cp test/browser test/browser/verify_guest_fs_cap.cljk
      - name: Stream browser E2E
        run: npx nbb -cp test/browser test/browser/verify_stream_browser.cljk
      # The README "Verified end-to-end" list has five entries; each entry's
      # proving test must run HERE. A verify_*.cljs that exists in test/browser
      # but has no CI step is a claim nobody runs — the exact failure mode
      # test:parity exists to prevent. The two below existed as runnable source
      # with no gate: the fs-browser shadow-cljs build is compiled above, and
      # wasm-tools is installed above, so both are gateable with no new
      # machinery.
      - name: kuro.fs in-browser E2E (fs-browser build)
        run: npx nbb -cp test/browser test/browser/verify_fs_browser.cljk
      - name: Stream Worker-convergence E2E (guest runs inside the Worker)
        run: npx nbb -cp test/browser test/browser/verify_stream_worker.cljk

      # The parity runner (test/run_parity_tests.cljk) and host runner
      # (test/run_host_tests.cljk) each carry a namespace-drift guard: a test
      # file that is never required runs nowhere yet stays green everywhere —
      # the silent-half-green class CLAUDE.md names. The browser E2Es have no
      # runner; each verify_*.cljs above is a standalone nbb script listed as
      # its own step, so the same drift needs an explicit gate here. A
      # verify_*.cljs that exists in test/browser but has no step in this job
      # is a claim nobody runs (the failure mode this job exists to prevent) —
      # nothing else in kuro's CI would execute it.
      - name: "Guard: every verify_*.cljs is wired into browser-e2e"
        run: |
          set -euo pipefail
          cd test/browser
          ls verify_*.cljs | sort > /tmp/verify_actual.txt
          printf '%s\n' verify_opfs_browser.cljs verify_guest_fs_cap.cljs \
            verify_stream_browser.cljs verify_fs_browser.cljs \
            verify_stream_worker.cljs | sort > /tmp/verify_wired.txt
          if ! diff -q /tmp/verify_wired.txt /tmp/verify_actual.txt >/dev/null; then
            echo "BROWSER-VERIFY-DRIFT: a verify_*.cljs is present but not wired into browser-e2e"
            diff /tmp/verify_wired.txt /tmp/verify_actual.txt
            exit 1
          fi
